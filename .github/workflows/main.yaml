name: Release application

on:
  push:
    branches:
      - '**'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  PROJECT_ID: ${{ secrets.GKE_PROJECT }}
  PROJECT_NUMBER: '907446083325'
  GKE_CLUSTER: dwk-gke
  GKE_ZONE: europe-north1-b
  REGISTRY: europe-north1-docker.pkg.dev
  REPOSITORY: devops-with-kubernetes-image-hub

jobs:
  build-publish-deploy:
    name: Build, Publish and Deploy
    runs-on: ubuntu-latest
    environment: GKE_PROJECT

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: "${{ secrets.WORKLOAD_IDENTITY_PROVIDER }}"
          service_account: "${{ secrets.SERVICE_ACCOUNT }}"

      - name: 'Set up Cloud SDK'
        uses: google-github-actions/setup-gcloud@v3

      - name: 'Use gcloud CLI'
        run: gcloud info

      - run: gcloud --quiet auth configure-docker "$REGISTRY"

      - name: 'Get GKE credentials'
        uses: 'google-github-actions/get-gke-credentials@v3'
        with:
          cluster_name: '${{ env.GKE_CLUSTER }}'
          project_id: '${{ env.PROJECT_ID }}'
          location: '${{ env.GKE_ZONE }}'

      - name: Select changed exercise directories
        shell: bash
        env:
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          set -euo pipefail

          before_sha="$BEFORE_SHA"
          if [[ -z "$before_sha" || "$before_sha" =~ ^0+$ ]]; then
            before_sha="$(git rev-parse "$GITHUB_SHA^")"
          fi

          mapfile -t exercise_dirs < <(
            git diff --name-only "$before_sha" "$GITHUB_SHA" \
              | awk -F/ '$1 == "chapter-4" && $2 ~ /^exercise-/ { print $1 "/" $2 }' \
              | sort -u
          )

          if ((${#exercise_dirs[@]} == 0)); then
            echo "No exercise directory changed; nothing to dispatch"
            echo "EXERCISE_DIRS=" >> "$GITHUB_ENV"
          else
            {
              echo "EXERCISE_DIRS<<EOF"
              printf '%s\n' "${exercise_dirs[@]}"
              echo "EOF"
            } >> "$GITHUB_ENV"
          fi

          namespace="$(printf '%s' "$GITHUB_REF_NAME" \
            | tr '[:upper:]' '[:lower:]' \
            | sed -E 's/[^a-z0-9-]+/-/g; s/-+/-/g; s/^-+//; s/-+$//')"

          if [[ -z "$namespace" || ${#namespace} -gt 63 ]]; then
            echo "Branch name cannot be converted to a valid namespace: $GITHUB_REF_NAME" >&2
            exit 1
          fi

          echo "NAMESPACE=$namespace" >> "$GITHUB_ENV"
          echo "Using namespace: $namespace"

      - name: Set up Kustomize
        uses: imranismail/setup-kustomize@v3

      - name: Run exercise pipelines
        run: |-
          set -euo pipefail

          if [[ -z "${EXERCISE_DIRS:-}" ]]; then
            echo "No exercise pipelines to run"
            exit 0
          fi

          while IFS= read -r exercise_dir; do
            [[ -z "$exercise_dir" ]] && continue
            pipeline="$exercise_dir/pipeline.sh"

            if [[ ! -f "$pipeline" ]]; then
              echo "No pipeline.sh in $exercise_dir; skipping"
              continue
            fi

            echo "Running $pipeline"
            bash "$pipeline"
          done <<< "$EXERCISE_DIRS"
