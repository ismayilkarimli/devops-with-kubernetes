name: Release application

on:
  push:
    branches:
      - '**'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  PROJECT_ID: ${{ secrets.GKE_PROJECT }}
  GKE_CLUSTER: dwk-gke
  GKE_ZONE: europe-north1-b
  REGISTRY: europe-north1-docker.pkg.dev
  REPOSITORY: devops-with-kubernetes-image-hub
  APP_IMAGE: todo-app
  SERVER_IMAGE: todo-server
  APP_DEPLOYMENT: todo-app-dep
  SERVER_DEPLOYMENT: todo-app-server-dep
  STORAGE_BUCKET: dwk-gke-storage
  STORAGE_KSA: dwk-storage-sa

jobs:
  build-publish-deploy:
    name: Build, Publish and Deploy
    runs-on: ubuntu-latest
    environment: GKE_PROJECT

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: "${{ secrets.WORKLOAD_IDENTITY_PROVIDER }}"
          service_account: "${{ secrets.SERVICE_ACCOUNT }}"

      - name: 'Set up Cloud SDK'
        uses: google-github-actions/setup-gcloud@v3

      - name: 'Use gcloud CLI'
        run: gcloud info

      - run: gcloud --quiet auth configure-docker "$REGISTRY"

      - name: 'Get GKE credentials'
        uses: 'google-github-actions/get-gke-credentials@v3'
        with:
          cluster_name: '${{ env.GKE_CLUSTER }}'
          project_id: '${{ env.PROJECT_ID }}'
          location: '${{ env.GKE_ZONE }}'

      - name: Form image names
        run: |
          echo "APP_IMAGE_TAG=$REGISTRY/$PROJECT_ID/$REPOSITORY/$APP_IMAGE:$GITHUB_SHA" >> "$GITHUB_ENV"
          echo "SERVER_IMAGE_TAG=$REGISTRY/$PROJECT_ID/$REPOSITORY/$SERVER_IMAGE:$GITHUB_SHA" >> "$GITHUB_ENV"

      - name: Select changed exercise directory
        shell: bash
        env:
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          set -euo pipefail

          before_sha="$BEFORE_SHA"
          if [[ -z "$before_sha" || "$before_sha" =~ ^0+$ ]]; then
            before_sha="$(git rev-parse "$GITHUB_SHA^")"
          fi

          mapfile -t exercise_dirs < <(
            git diff --name-only "$before_sha" "$GITHUB_SHA" \
              | awk -F/ '$1 == "chapter-4" && $2 ~ /^exercise-/ { print $1 "/" $2 }' \
              | sort -u
          )

          if ((${#exercise_dirs[@]} == 0)); then
            echo "No exercise directory changed in this push" >&2
            exit 1
          fi

          if ((${#exercise_dirs[@]} > 1)); then
            echo "More than one exercise directory changed:" >&2
            printf ' - %s\n' "${exercise_dirs[@]}" >&2
            exit 1
          fi

          exercise_dir="${exercise_dirs[0]}"
          for required_dir in todo-app todo-server manifests; do
            if [[ ! -d "$exercise_dir/$required_dir" ]]; then
              echo "Selected exercise is missing $required_dir: $exercise_dir" >&2
              exit 1
            fi
          done

          echo "Using changed exercise directory: $exercise_dir"
          echo "EXERCISE_DIR=$exercise_dir" >> "$GITHUB_ENV"

      - name: Build app image
        run: docker build --platform linux/amd64 --tag "$APP_IMAGE_TAG" "$EXERCISE_DIR/todo-app"

      - name: Build server image
        run: docker build --platform linux/amd64 --tag "$SERVER_IMAGE_TAG" "$EXERCISE_DIR/todo-server"

      - name: Publish app image
        run: docker push "$APP_IMAGE_TAG"

      - name: Publish server image
        run: docker push "$SERVER_IMAGE_TAG"

      - name: Set up Kustomize
        uses: imranismail/setup-kustomize@v3

      - name: Deploy
        run: |-
          set -euo pipefail

          namespace="$GITHUB_REF_NAME"
          kubectl create namespace "$namespace" --dry-run=client -o yaml | kubectl apply -f -
          kubectl wait --for=jsonpath='{.status.phase}'=Active "namespace/$namespace" --timeout=60s
          kubectl config set-context --current --namespace="$namespace"

          cd "$EXERCISE_DIR/manifests"
          kustomize edit set namespace "$namespace"
          kustomize edit set image \
            APP/IMAGE="$APP_IMAGE_TAG" \
            SERVER/IMAGE="$SERVER_IMAGE_TAG"
          kustomize build . | kubectl apply -f -
          kubectl get serviceaccount "$STORAGE_KSA"

          PROJECT_NUMBER="$(gcloud projects describe "$PROJECT_ID" --format='value(projectNumber)')"
          STORAGE_PRINCIPAL="principal://iam.googleapis.com/projects/${PROJECT_NUMBER}/locations/global/workloadIdentityPools/${PROJECT_ID}.svc.id.goog/subject/ns/${namespace}/sa/${STORAGE_KSA}"
          gcloud storage buckets add-iam-policy-binding "gs://${STORAGE_BUCKET}" \
            --role=roles/storage.objectUser \
            --member="$STORAGE_PRINCIPAL" \
            --condition=None

          kubectl rollout status deployment "$APP_DEPLOYMENT" --timeout=5m
          kubectl rollout status deployment "$SERVER_DEPLOYMENT" --timeout=5m
          kubectl get services -o wide
