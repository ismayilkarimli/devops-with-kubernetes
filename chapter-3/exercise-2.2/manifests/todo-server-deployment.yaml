apiVersion: apps/v1
kind: Deployment
metadata:
  name: todo-server-dep
spec:
  replicas: 1
  selector:
    matchLabels:
      app: todo-server
  template:
    metadata:
      labels:
        app: todo-server
    spec:
      containers:
        - name: todo-server
          image: ismayilkarimli/devops-with-kubernetes:2.2-todo-server
          imagePullPolicy: Always
          env:
            - name: PORT
              value: "8082"
            - name: TODO_APP_URL
              value: http://todo-app-svc:2345
