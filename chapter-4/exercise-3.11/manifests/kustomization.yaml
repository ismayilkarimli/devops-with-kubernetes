apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - app-configmap.yaml
  - app-deployment.yaml
  - app-service.yaml
  - backup-cronjob.yaml
  - ingress.yaml
  - job.yaml
  - limitrange.yaml
  - persistentvolumeclaim.yaml
  - resourcequota.yaml
  - server-configmap.yaml
  - server-deployment.yaml
  - server-service.yaml
  - service-account.yaml
  - statefulset.yaml
images:
  - name: APP/IMAGE
    newName: ismayilkarimli/devops-with-kubernetes
    newTag: 3.11-app
  - name: SERVER/IMAGE
    newName: ismayilkarimli/devops-with-kubernetes
    newTag: 3.11-server
