apiVersion: v1
kind: LimitRange
metadata:
  name: application-limits
  namespace: default
spec:
  limits:
    - type: Container
      min:
        cpu: "80m"
        memory: "64Mi"
      defaultRequest:
        cpu: "80m"
        memory: "204Mi"
      default:
        cpu: "160m"
        memory: "819Mi"
