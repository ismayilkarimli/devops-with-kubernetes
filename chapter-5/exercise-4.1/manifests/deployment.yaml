apiVersion: apps/v1
kind: Deployment
metadata:
  name: ping-app-dep
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ping-app
  template:
    metadata:
      labels:
        app: ping-app
    spec:
      volumes:
        - name: config-map-volume
          configMap:
            name: ping-app-cm
      containers:
        - name: ping-app
          image: europe-north1-docker.pkg.dev/project-73e492cb-c289-416f-b04/devops-with-kubernetes-image-hub/ping-app:4.1
          imagePullPolicy: Always
          readinessProbe:
            exec:
              command: ["/server", "--check-db"]
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3

          env:
            - name: DATABASE_URL
              valueFrom:
                configMapKeyRef:
                  name: ping-app-cm
                  key: DATABASE_URL
        - name: log-app
          image: europe-north1-docker.pkg.dev/project-73e492cb-c289-416f-b04/devops-with-kubernetes-image-hub/log-app:4.1
          imagePullPolicy: Always
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 5
            failureThreshold: 5
          volumeMounts:
            - name: config-map-volume
              mountPath: /etc/config
              readOnly: true
          env:
            - name: MESSAGE
              valueFrom:
                configMapKeyRef:
                  name: ping-app-cm
                  key: MESSAGE
            - name: PONG_SERVICE_URL
              value: http://ping-app-svc:2346/pings
