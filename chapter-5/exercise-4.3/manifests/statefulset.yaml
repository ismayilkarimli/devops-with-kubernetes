apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: sample-statefulset
  namespace: prometheus
spec:
  replicas: 2
  selector:
    matchLabels:
      app: hello-set
  template:
    metadata:
      labels:
        app: hello-set
    spec:
      containers:
        - name: hello-world
          image: hello-world