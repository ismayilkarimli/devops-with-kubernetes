apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../manifests
patches:
  - target:
      kind: Rollout
      name: ping-app-dep
    patch: |-
      - op: add
        path: /spec/template/spec/containers/-
        value:
          name: cpu-burner
          image: busybox:1.36
          command: ["sh", "-c", "while true; do :; done"]
          resources:
            requests:
              cpu: "0"
            limits:
              cpu: 200m
