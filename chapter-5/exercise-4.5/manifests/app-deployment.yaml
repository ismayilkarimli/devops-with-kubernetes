apiVersion: apps/v1
kind: Deployment
metadata:
  name: todo-app-dep
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: todo-app
  template:
    metadata:
      labels:
        app: todo-app
    spec:
      volumes:
        - name: todo-app-volume
          persistentVolumeClaim:
            claimName: todo-app-pvc
      containers:
        - name: app
          image: APP/IMAGE
          livenessProbe:
            initialDelaySeconds: 80
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: 3
            httpGet:
              path: /live
              port: 8080
          readinessProbe:
            initialDelaySeconds: 20
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: 3
            httpGet:
              path: /healthz
              port: 8080
          volumeMounts:
            - name: todo-app-volume
              mountPath: /usr/src/app/data
          envFrom:
            - configMapRef:
                name: todo-app-cm
