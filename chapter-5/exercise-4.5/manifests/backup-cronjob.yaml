apiVersion: batch/v1
kind: CronJob
metadata:
  name: todo-db-backup
spec:
  schedule: "0 0 * * *"
  jobTemplate:
    spec:
      template:
        spec:
          serviceAccountName: dwk-storage-sa
          restartPolicy: OnFailure
          containers:
            - name: database-backup
              image: google/cloud-sdk:slim
              env:
                - name: URL
                  value: postgres://postgres:postgres@todo-app-db-svc:5432/tododb
              command:
                - /bin/bash
                - -ceu
                - |
                  apt-get update
                  DEBIAN_FRONTEND=noninteractive apt-get install --yes --no-install-recommends ca-certificates curl

                  install -d /usr/share/postgresql-common/pgdg
                  curl --fail --silent --show-error \
                    --output /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc \
                    https://www.postgresql.org/media/keys/ACCC4CF8.asc

                  . /etc/os-release
                  architecture="$(dpkg --print-architecture)"
                  cat > /etc/apt/sources.list.d/pgdg.sources <<EOF
                  Types: deb
                  URIs: https://apt.postgresql.org/pub/repos/apt
                  Suites: ${VERSION_CODENAME}-pgdg
                  Architectures: ${architecture}
                  Components: main
                  Signed-By: /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc
                  EOF

                  apt-get update
                  DEBIAN_FRONTEND=noninteractive apt-get install --yes --no-install-recommends postgresql-client-18
                  rm -rf /var/lib/apt/lists/*

                  if [ -n "${URL:-}" ]; then
                    timestamp="$(date +%s)"
                    dump="/tmp/backup-${timestamp}.sql"
                    pg_dump="/usr/lib/postgresql/18/bin/pg_dump"
                    "$pg_dump" --version
                    "$pg_dump" -v "$URL" > "$dump"
                    gcloud storage cp "$dump" "gs://dwk-gke-storage/backups/backup-${timestamp}.sql"
                  fi
