apiVersion: apps/v1
kind: Deployment
metadata:
  name: broadcaster
spec:
  replicas: 6
  selector:
    matchLabels:
      app: broadcaster
  template:
    metadata:
      labels:
        app: broadcaster
    spec:
      containers:
        - name: broadcaster
          image: BROADCASTER/IMAGE
          env:
            - name: NATS_URL
              valueFrom:
                configMapKeyRef:
                  name: todo-app-server-cm
                  key: NATS_URL
            - name: WEBHOOK_URL
              value: https://httpbin.org/post
